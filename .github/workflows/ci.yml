name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (self-hosted)
    # "self-hosted", "linux" and "x64" are added automatically by the runner;
    # "python" is the custom label set in runner/.env.
    runs-on: [self-hosted, linux, x64, python]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          echo "Runner name: ${RUNNER_NAME:-unknown}"
          echo "Runner OS  : ${RUNNER_OS:-unknown}"
          echo "Kernel     : $(uname -sr)"
          python3 --version

      - name: Create virtualenv and install dependencies
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: |
          . .venv/bin/activate
          python -m pytest -v

      - name: Smoke-test the calculator
        run: |
          . .venv/bin/activate
          python -c "from calculator import add, divide; assert add(2, 3) == 5; print('divide(10, 4) =', divide(10, 4))"
